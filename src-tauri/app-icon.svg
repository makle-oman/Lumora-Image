<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132b" /> <!-- Deep dark purple-indigo -->
      <stop offset="40%" stop-color="#281a3e" /> <!-- Rich deep plum -->
      <stop offset="100%" stop-color="#0b0813" /> <!-- Midnight black -->
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#f472b6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#60a5fa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Shadow Filter for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Glowing effect filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Sleek Glowing Inner Border -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="4.5" opacity="0.9" />

  <!-- Decorative Camera Aperture Blades & Lens Rings (Themes: Creative, Photo, Lumora Light) -->
  <g opacity="0.15" stroke-linecap="round">
    <!-- Concentric circles -->
    <circle cx="256" cy="256" r="190" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="12 18" />
    <circle cx="256" cy="256" r="160" fill="none" stroke="#f472b6" stroke-width="1" />
    <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 24" />
    
    <!-- Aperture Blades lines -->
    <line x1="256" y1="96" x2="390" y2="256" stroke="#f472b6" stroke-width="1.5" />
    <line x1="390" y1="256" x2="256" y2="416" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="256" y1="416" x2="122" y2="256" stroke="#a78bfa" stroke-width="1.5" />
    <line x1="122" y1="256" x2="256" y2="96" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Brand Typography -->
  <g filter="url(#shadow)">
    <!-- Stylized brand letters 'Lu' (matches front-end sidebar brand exactly but with modern premium coloring) -->
    <text x="228" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-style="italic" font-weight="bold" fill="url(#textGrad)" text-anchor="middle">Lu</text>
    
    <!-- Registered trademark symbol -->
    <text x="362" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="normal" fill="#e2e8f0" opacity="0.9">®</text>
  </g>

  <!-- Dynamic Sparkle/Light flare (Creative Bloom) -->
  <circle cx="360" cy="316" r="10" fill="#38bdf8" filter="url(#glow)" opacity="0.9" />
  <circle cx="360" cy="316" r="5" fill="#ffffff" />
</svg>
